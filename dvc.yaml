stages:
  train_ml_engine:
    cmd: python src/ml_engine.py
    deps:
      - data/BAF_NeurIPS_2022.csv
      - src/ml_engine.py
    outs:
      - artifacts/champion_model.pkl
      - artifacts/scaler.pkl
      - artifacts/pca_transformer.pkl
      - data/audit_ledger.json
    metrics:
      - artifacts/pca_metrics.json:
          cache: false
