[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-security-agent"
version = "1.0.0"
description = "FinOps and Security Compliance Agent with NeurIPS ML fraud risk scoring and SHA-256 audit logging."
readme = "README.md"
authors = [{ name = "Priyanka Hichkad" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "streamlit",
    "openpyxl",
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
